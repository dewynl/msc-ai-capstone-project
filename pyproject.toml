[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-ai-capstone"
version = "0.1.0"
description = "Domain-Specific AI for Educational Syllabus Generation"
authors = [{name = "Dewyn Liriano", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
    "accelerate>=0.20.0",
    "anthropic>=0.7.0",
    "nltk>=3.8.0",
    "spacy>=3.7.0",
    "wandb>=0.15.0",
    "tensorboard>=2.14.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]

dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "bandit[toml]>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/dewynl/msc-ai-capstone-project"
Repository = "https://github.com/dewynl/msc-ai-capstone-project"
Issues = "https://github.com/dewynl/msc-ai-capstone-project/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Development tool configurations

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data/raw
)/
'''



[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests", "data/raw"]
skips = ["B101", "B601", "B311"]
